[project]
name = "candleforge-quant"
version = "0.1.0"
description = "CandleForge Python 回测服务（backtrader），通过 gRPC 被 Go 主服务调用"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "backtrader==1.9.78.123",
    "numpy==1.26.4",  # 必须 <2：numpy 2.0 删了 np.bool 等，backtrader 会崩
    "pandas==2.2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pb", "backtest", "strategies"]
