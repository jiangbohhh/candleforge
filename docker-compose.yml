# CandleForge 本地开发编排
# 用法：cp .env.example .env && docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-candleforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-candleforge}
      POSTGRES_DB: ${DB_NAME:-candleforge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-candleforge}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  quant-py:
    build:
      context: .
      dockerfile: quant-py/Dockerfile
    environment:
      GRPC_ADDR: "[::]:50051"
    ports:
      - "50051:50051"

  backend-go:
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      QUANT_ADDR: "quant-py:50051"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-candleforge}
      DB_PASSWORD: ${DB_PASSWORD:-candleforge}
      DB_NAME: ${DB_NAME:-candleforge}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      quant-py:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend-go

volumes:
  pgdata:
